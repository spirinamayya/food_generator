<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cheerful random lunch menu picker.">
  <title>Lunch Lucky Dip</title>
  <style>
    :root {
      --ink: #17253b;
      --paper: #fffaf0;
      --orange: #ff7043;
      --yellow: #ffd166;
      --blue: #5fa8d3;
      --cream: #f3ead7;
      --shadow: 10px 10px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, var(--yellow) 0 70px, transparent 72px),
        radial-gradient(circle at 92% 88%, var(--blue) 0 105px, transparent 107px),
        var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 40px));
      margin: 40px auto;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 14px 4px;
      padding: 8px 13px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--yellow);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    .lunch-card {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(340px, 1.05fr);
      min-height: 590px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 26px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(34px, 6vw, 72px);
    }

    h1 {
      max-width: 520px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 7vw, 6.5rem);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    h1 span {
      color: var(--orange);
      font-style: italic;
    }

    .intro {
      max-width: 430px;
      margin: 28px 0 32px;
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.65;
    }

    .picker-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 18px;
    }

    .filter-field {
      display: grid;
      gap: 7px;
      font-weight: 800;
    }

    .cuisine-filter {
      min-width: 180px;
      padding: 14px 38px 14px 14px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      color: var(--ink);
      background: var(--paper);
      font: inherit;
      font-weight: 700;
    }

    .cuisine-filter:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .generate-button {
      width: fit-content;
      padding: 16px 24px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 5px 5px 0 var(--ink);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .generate-button:hover {
      background: #ffe08b;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--ink);
    }

    .generate-button:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .generate-button:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .result {
      height: 2.5em;
      min-height: 58px;
      overflow: hidden;
      margin: 30px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 700;
      line-height: 1.25;
    }

    .result.is-new {
      animation: pop-in 380ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .dish-details {
      min-height: 142px;
      margin-top: 14px;
    }

    .detail-list {
      margin: 0 0 10px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      min-height: 28px;
      align-items: center;
    }

    .detail-row dt {
      font-weight: 800;
    }

    .detail-row dd {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recipe-link {
      display: inline-block;
      min-height: 24px;
      color: var(--ink);
      font-weight: 800;
      text-underline-offset: 4px;
    }

    .recipe-link.is-hidden {
      visibility: hidden;
    }

    .recipe-link:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 3px;
    }

    .photo-panel {
      position: relative;
      min-height: 390px;
      overflow: hidden;
      border-left: 3px solid var(--ink);
      background: var(--blue);
    }

    .photo-panel::before,
    .photo-panel::after {
      position: absolute;
      z-index: 2;
      content: "";
      pointer-events: none;
    }

    .photo-panel::before {
      top: 24px;
      right: 24px;
      width: 54px;
      height: 54px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
    }

    .photo-panel::after {
      right: 22px;
      bottom: 22px;
      width: 110px;
      height: 18px;
      border: 3px solid var(--ink);
      background: var(--orange);
      transform: rotate(-6deg);
    }

    .food-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
      object-position: center;
      filter: saturate(0.9) contrast(1.04);
    }

    .food-photo.is-visible {
      display: block;
      animation: reveal-photo 520ms ease both;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 22px;
      padding: 40px;
      text-align: center;
    }

    .plate {
      width: clamp(180px, 24vw, 250px);
      aspect-ratio: 1;
      margin: auto;
      display: grid;
      place-items: center;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      font-size: clamp(4rem, 8vw, 6rem);
    }

    .photo-placeholder p {
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .photo-credit {
      position: absolute;
      z-index: 3;
      left: 16px;
      bottom: 14px;
      display: none;
      margin: 0;
      padding: 6px 9px;
      border-radius: 6px;
      color: #fff;
      background: rgba(23, 37, 59, 0.82);
      font-size: 0.7rem;
    }

    .photo-credit.is-visible {
      display: block;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(12px) rotate(-1deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotate(0);
      }
    }

    @keyframes reveal-photo {
      from {
        opacity: 0;
        transform: scale(1.04);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 760px) {
      body {
        place-items: start center;
        background:
          radial-gradient(circle at 0 4%, var(--yellow) 0 48px, transparent 50px),
          var(--cream);
      }

      .page {
        width: min(100% - 28px, 620px);
        margin: 28px auto 38px;
      }

      .lunch-card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .content {
        min-height: 480px;
        padding: 38px 26px;
      }

      h1 {
        font-size: clamp(3.4rem, 17vw, 5.5rem);
      }

      .photo-panel {
        min-height: 380px;
        border-top: 3px solid var(--ink);
        border-left: 0;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Lunch decision hotline</p>
    <section class="lunch-card" aria-labelledby="page-title">
      <div class="content">
        <h1 id="page-title">What's for <span>lunch?</span></h1>
        <p class="intro">Let chance choose your next delicious meal. One click, zero lunchtime debates.</p>
        <div class="picker-controls">
          <label class="filter-field" for="cuisine-filter">
            Cuisine
            <select class="cuisine-filter" id="cuisine-filter">
              <option value="All cuisines">All cuisines</option>
              <option value="American">American</option>
              <option value="Asian">Asian</option>
              <option value="Italian">Italian</option>
              <option value="Japanese">Japanese</option>
              <option value="Mediterranean">Mediterranean</option>
              <option value="Mexican">Mexican</option>
            </select>
          </label>
          <button class="generate-button" id="generate-button" type="button">Generate Lunch!</button>
        </div>
        <p class="result" id="result" aria-live="polite">Your lunch destiny awaits.</p>
        <div class="dish-details" aria-label="Dish details">
          <dl class="detail-list">
            <div class="detail-row"><dt>Cuisine</dt><dd id="detail-cuisine">—</dd></div>
            <div class="detail-row"><dt>Ready in</dt><dd id="detail-time">—</dd></div>
            <div class="detail-row"><dt>Difficulty</dt><dd id="detail-difficulty">—</dd></div>
          </dl>
          <a class="recipe-link is-hidden" id="recipe-link" href="https://www.allrecipes.com/search" target="_blank" rel="noopener noreferrer" aria-hidden="true">Find a recipe</a>
        </div>
      </div>

      <div class="photo-panel">
        <div class="photo-placeholder" id="photo-placeholder" aria-hidden="true">
          <div class="plate">?</div>
          <p>Your pick will appear here</p>
        </div>
        <img class="food-photo" id="food-photo" alt="">
        <p class="photo-credit" id="photo-credit">Photo via Unsplash</p>
      </div>
    </section>
  </main>

  <script>

      {

      },
      {
        name: "Kebab",
        cuisine: "Mediterranean",

        difficulty: "Medium",

      },
      {
        name: "Grilled Cheese",
        cuisine: "American",
        time: "15 min",
        difficulty: "Easy",
        photo: "https://images.unsplash.com/photo-1528736235302-52922df5c122?auto=format&fit=crop&w=1200&q=85"
      }
    ];

    const button = document.querySelector("#generate-button");
    const cuisineFilter = document.querySelector("#cuisine-filter");
    const result = document.querySelector("#result");
    const foodPhoto = document.querySelector("#food-photo");
    const placeholder = document.querySelector("#photo-placeholder");
    const photoCredit = document.querySelector("#photo-credit");
    const detailCuisine = document.querySelector("#detail-cuisine");
    const detailTime = document.querySelector("#detail-time");
    const detailDifficulty = document.querySelector("#detail-difficulty");
    const recipeLink = document.querySelector("#recipe-link");
    let previousDishName = null;

    button.addEventListener("click", () => {
      const filteredOptions = cuisineFilter.value === "All cuisines"
        ? lunchOptions
        : lunchOptions.filter((dish) => dish.cuisine === cuisineFilter.value);
      const availableOptions = filteredOptions.filter((dish) => dish.name !== previousDishName);
      const randomIndex = Math.floor(Math.random() * availableOptions.length);
      const choice = availableOptions[randomIndex];
      previousDishName = choice.name;

      result.textContent = `Today's pick: ${choice.name}!\u00A0🥳`;
      detailCuisine.textContent = choice.cuisine;
      detailTime.textContent = choice.time;
      detailDifficulty.textContent = choice.difficulty;
      recipeLink.textContent = "Find a recipe";
      recipeLink.href = `https://www.allrecipes.com/search?q=${encodeURIComponent(choice.name)}`;
      recipeLink.classList.remove("is-hidden");
      recipeLink.removeAttribute("aria-hidden");
      foodPhoto.src = choice.photo;
      foodPhoto.alt = `A plate of ${choice.name}`;
      placeholder.hidden = true;
      foodPhoto.classList.add("is-visible");
      photoCredit.classList.add("is-visible");

      result.classList.remove("is-new");
      void result.offsetWidth;
      result.classList.add("is-new");
    });
  </script>
</body>
</html>
